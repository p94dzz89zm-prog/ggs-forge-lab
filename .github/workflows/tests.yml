name: runner-tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: dragonmind-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bounded Python tests
        run: python .github/scripts/bounded_stage.py --stage python --seconds 300 -- python -m unittest discover -s . -p 'test_*.py'
      - name: Preserve Python stage immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-results/python.*
          if-no-files-found: error
          retention-days: 90
      - name: Compile pure-JDK failure-reporting contracts
        if: success()
        run: python .github/scripts/bounded_stage.py --stage compile --seconds 60 -- javac -d /tmp/dragonmind-contracts forge-fork/RegressionLauncher.java forge-fork/RegressionLauncherRegression.java
      - name: Verify subprocess failure reporting
        if: success()
        run: python .github/scripts/bounded_stage.py --stage launcher --seconds 60 -- java -cp /tmp/dragonmind-contracts RegressionLauncherRegression
      - name: Preserve all available results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 90
      - name: Publish evidence summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Bounded code evaluation\n\n')
              for p in sorted(Path('ci-results').glob('*.json')):
                  r=json.loads(p.read_text())
                  out.write(f"- {r['stage']}: {r['status']} ({r['source_commit']})\n")
              out.write('\nArtifacts retain logs and hashes for 90 days. This job does not run private Forge games or train a model.\n')
          PY
