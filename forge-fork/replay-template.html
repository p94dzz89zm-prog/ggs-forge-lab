<div id="ggs-replay">
  <header><div><strong>Dragon table</strong><span>Recorded assisted Commander game · GGS vs three Forge AIs</span></div><div id="gr-step"></div></header>
  <div class="gr-controls"><button id="gr-back" type="button">← Back</button><button id="gr-play" type="button">Play</button><button id="gr-next" type="button">Next →</button><label>Position <input id="gr-seek" type="range" min="0" value="0"></label></div>
  <div id="gr-status" aria-live="polite"></div>
  <div id="gr-board"></div>
  <div class="gr-bottom"><div><strong>Decision</strong><p id="gr-reason"></p><div id="gr-action"></div></div><div><strong>Stack</strong><div id="gr-stack"></div></div></div>
  <details><summary>GGS hand and graveyard</summary><div id="gr-hand"></div><div id="gr-grave"></div></details>
  <div id="gr-detail" aria-live="polite"></div>
</div>
<style>
#ggs-replay{--gr-bg:light-dark(#e8f0ec,#101f1a);--gr-panel:light-dark(#f8faf8,#1b3027);--gr-ink:light-dark(#18362a,#ebf4ed);--gr-muted:light-dark(#496357,#b7cabc);--gr-gold:light-dark(#8b5812,#e6bc74);--gr-line:light-dark(#b7cdbf,#3e5b4b);color-scheme:light dark;color:var(--gr-ink);background:var(--gr-bg);font:14px/1.5 system-ui,sans-serif;border-radius:18px;padding:20px;box-sizing:border-box;max-width:100%;}
#ggs-replay *{box-sizing:border-box}#ggs-replay header{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;padding-right:85px}#ggs-replay header strong{font-size:22px;font-weight:500}#ggs-replay header span{display:block;color:var(--gr-muted);font-size:12px}
#ggs-replay button{font:inherit;color:var(--gr-ink);background:var(--gr-panel);border:1px solid var(--gr-line);border-radius:8px;padding:7px 12px;cursor:pointer}#ggs-replay button:disabled{opacity:.5}#ggs-replay button[aria-pressed=true]{background:var(--gr-ink);color:var(--gr-panel)}#ggs-replay .gr-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}#ggs-replay label{display:flex;gap:8px;align-items:center;flex:1;min-width:160px}#ggs-replay input{width:100%;accent-color:var(--gr-gold);min-width:0}#gr-status{margin-bottom:12px;color:var(--gr-muted)}
#gr-board{display:grid;grid-template-columns:1fr 1fr;gap:12px}#ggs-replay .gr-seat{background:var(--gr-panel);border:1px solid var(--gr-line);border-radius:12px;padding:12px;min-width:0}#ggs-replay .gr-seat.active{box-shadow:inset 0 3px 0 var(--gr-gold)}#ggs-replay .gr-seat.out{opacity:.55}#ggs-replay .gr-seat-head{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}#ggs-replay .gr-life{font-size:20px;font-variant-numeric:tabular-nums;font-weight:500}#ggs-replay .gr-resources{color:var(--gr-muted);font-size:12px;margin-bottom:8px}#ggs-replay .gr-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:7px}#ggs-replay button.gr-card{padding:8px;text-align:left;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;overflow-wrap:anywhere;font-size:12px}#ggs-replay .gr-card.commander{border-color:var(--gr-gold);background:light-dark(#fff3dd,#3c3120)}#ggs-replay .gr-card.dragon{background:light-dark(#efe4dc,#38291e)}#ggs-replay .gr-card.tapped{opacity:.65}#ggs-replay .gr-card .gr-art{font-size:26px;line-height:1}#ggs-replay .gr-card .gr-foot{color:var(--gr-muted);display:flex;justify-content:space-between;gap:4px}#ggs-replay .gr-bottom{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:16px}#ggs-replay p{margin:4px 0}#ggs-replay details{margin-top:16px}#gr-detail{padding-top:12px;overflow-wrap:anywhere}#gr-hand,#gr-grave{padding-top:8px;color:var(--gr-muted)}#gr-action,#gr-stack{color:var(--gr-muted);font-size:12px}#ggs-replay strong{font-weight:500}
@media(max-width:600px){#gr-board,#ggs-replay .gr-bottom{grid-template-columns:1fr}#ggs-replay{padding:12px}#ggs-replay header{padding-right:0}#ggs-replay .gr-cards{grid-template-columns:repeat(auto-fit,minmax(95px,1fr))}}
@media(pointer:coarse){#ggs-replay button{min-height:44px}}
</style>
<script>
(()=>{
 const root=document.getElementById('ggs-replay'), data=__REPLAY_DATA__, names=['GGS · guided','Jaymie · Ezio','Gabe · Food','Destyn · Turtles'];
 const el=id=>root.querySelector('#'+id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let position=0,timer=null; const seek=el('gr-seek');seek.max=data.frames.length-1;
 function icon(c){return c.n.includes('Dragon')?'🐉':c.n.includes('Goro-Goro')?'🥷':c.t.includes('Ninja')?'🥷':c.t.includes('Equipment')?'🛡️':c.n.includes('Treasure')?'💎':c.n.includes('Food')?'🍞':c.t.includes('Creature')?'⚔️':'✦'}
 function card(c){let commander=c.n==='Goro-Goro and Satoru';return `<button type="button" class="gr-card ${commander?'commander':''} ${c.n.includes('Dragon')?'dragon':''} ${c.tap?'tapped':''}" data-card="${c.id}"><span class="gr-art" aria-hidden="true">${icon(c)}</span><span>${esc(c.n||'Manifest · face down')}</span><span class="gr-foot"><span>${c.t.includes('Creature')?c.p+'/'+c.h:esc(c.cost)}</span><span>${c.tap?'Tapped':'Ready'}</span></span></button>`}
 function draw(){const f=data.frames[position], own=f.players.find(p=>p.id===0);seek.value=position;el('gr-step').textContent=`${position+1} / ${data.frames.length}`;el('gr-status').textContent=f.outcome||`Turn ${f.turn} · ${names[f.active]} · ${f.phase.replaceAll('_',' ').toLowerCase()}`;
  el('gr-board').innerHTML=names.map((name,id)=>{const p=f.players.find(p=>p.id===id);if(!p)return `<section class="gr-seat out"><div class="gr-seat-head"><strong>${name}</strong><span>Eliminated</span></div></section>`;const lands=p.cards.filter(c=>c.t.includes('Land')),field=p.cards.filter(c=>!c.t.includes('Land'));return `<section class="gr-seat ${id===f.active?'active':''}"><div class="gr-seat-head"><strong>${name}</strong><span class="gr-life">${p.life} ♥</span></div><div class="gr-resources">${lands.length} lands · ${lands.filter(c=>!c.tap).length} untapped · ${p.handCount} cards in hand${id===0?' · '+field.filter(c=>c.n.includes('Dragon')).length+' Dragons':''}</div><div class="gr-cards">${field.map(card).join('')||'No nonland permanents'}</div></section>`}).join('');
  el('gr-reason').textContent=f.reason;el('gr-action').textContent=f.action;el('gr-stack').textContent=f.stack.join(' → ')||'Empty';el('gr-hand').textContent='Hand: '+(own?.hand||[]).join(' · ');el('gr-grave').textContent='Graveyard: '+(own?.grave||[]).join(' · ');el('gr-detail').textContent='';el('gr-back').disabled=position===0;el('gr-next').disabled=position===data.frames.length-1;
 }
 function pause(){if(timer)clearInterval(timer);timer=null;el('gr-play').textContent='Play';el('gr-play').setAttribute('aria-pressed','false')}
 el('gr-play').onclick=()=>{if(timer){pause();return}if(position===data.frames.length-1)position=0;el('gr-play').textContent='Pause';el('gr-play').setAttribute('aria-pressed','true');timer=setInterval(()=>{if(position>=data.frames.length-1){pause();return}position++;draw()},1500)};
 el('gr-next').onclick=()=>{pause();position=Math.min(data.frames.length-1,position+1);draw()};el('gr-back').onclick=()=>{pause();position=Math.max(0,position-1);draw()};seek.oninput=()=>{pause();position=Number(seek.value);draw()};
 el('gr-board').onclick=e=>{const button=e.target.closest('[data-card]');if(!button)return;const c=data.frames[position].players.flatMap(p=>p.cards).find(c=>c.id===Number(button.dataset.card));if(!c)return;el('gr-detail').textContent=(c.n||'Manifest · face down')+' — '+(data.oracle[c.n]||c.t)+ (c.tap?' · Tapped':'')};draw();
})();
</script>
